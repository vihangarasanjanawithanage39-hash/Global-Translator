name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_project.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -o android_project.zip -d build_src
      - run: gradle assembleDebug --no-daemon
        working-directory: build_src/android_project
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalTranslator-APK
          path: build_src/android_project/app/build/outputs/apk/debug/app-debug.apk
